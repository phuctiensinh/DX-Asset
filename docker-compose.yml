version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dx_asset_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dx_password_secret}
      POSTGRES_DB: ${POSTGRES_DB:-dx_asset_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-keycloak-db.sql:/docker-entrypoint-initdb.d/01-init-keycloak-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dx_user} -d ${POSTGRES_DB:-dx_asset_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: dx_asset_keycloak
    restart: always
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_password_secret}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER:-dx_user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-dx_password_secret}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HEALTH_ENABLED: "true"
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  seaweedfs:
    image: chrislusf/seaweedfs:3.79
    container_name: dx_asset_seaweedfs
    restart: always
    command: server -dir=/data -filer=true -master.port=9333 -volume.port=8080 -filer.port=8888 -s3=false
    ports:
      - "8888:8888"
      - "9333:9333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8888/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dx_asset_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dx_user}:${POSTGRES_PASSWORD:-dx_password_secret}@postgres:5432/${POSTGRES_DB:-dx_asset_db}
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production-super-secret-key-32bytes}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      - AI_ENABLED=${AI_ENABLED:-true}
      - AI_API_KEY=${AI_API_KEY:-}
      - SEAWEEDFS_FILER_URL=${SEAWEEDFS_FILER_URL:-http://seaweedfs:8888}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dx_asset_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  seaweedfs_data:
